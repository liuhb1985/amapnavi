apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 正式签名配置：keystore.properties 不入库(见 .gitignore)，内容示例：
//   storeFile=amapnavi.jks
//   storePassword=xxx
//   keyAlias=xxx
//   keyPassword=xxx
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}


android {
    compileSdkVersion 28
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.carrot.amapnavi"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 3
        versionName "1.3.3.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 只打包真机 ABI：x86/x86_64 仅模拟器需要，去掉可让 APK 减少约 15~18MB
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
            // 若设备全是 64 位（如车机），可只保留 "arm64-v8a"，再多省约 8MB
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile", "amapnavi.jks"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
                //amapnavi.jks 是 JKS 格式，JDK 9+ 默认按 PKCS12 读取会报"密码错误"，必须显式指定
                storeType keystoreProps.getProperty("storeType", "jks")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false // 关闭混淆
            shrinkResources false
        }
        release {
            minifyEnabled false
            //minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            //未签名的 APK 在 Android 7.0+ 无法安装(解析软件包失败)，所以默认用 debug 签名保证能装；
            //若存在 keystore.properties 则改用 amapnavi.jks 正式签名(可覆盖安装正式签名版本)
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    aaptOptions {
        noCompress "onnx"
    }
}

// release 产物归档：app/release/AmapNavi-V{versionName}.apk（与历史发布包命名一致）
def releaseArchiveDir = file("$projectDir/release")
android.applicationVariants.all { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.all { output ->
            outputFileName = "AmapNavi-V${variant.versionName}.apk"
        }
    }
}
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            copy {
                from "$buildDir/outputs/apk/release"
                into releaseArchiveDir
                include "*.apk"
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    implementation 'com.google.code.gson:gson:2.10.1'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9'

    // lifecycleScope
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    //implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.0"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
    implementation "com.squareup.okhttp3:okhttp:4.9.3"
    //implementation project(':libuvccamera')
    //implementation project(':usbCameraCommon')

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}
